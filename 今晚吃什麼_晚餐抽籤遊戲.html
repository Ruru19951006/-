<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今晚吃什麼？</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#fffaf4,#eef6f5);color:#263238;min-height:100vh}
.wrap{max-width:560px;margin:auto;padding:28px 18px 40px}
header{text-align:center;padding:18px 0 22px}
.badge{display:inline-block;background:#ffffffaa;border:1px solid #eadfce;border-radius:999px;padding:7px 12px;font-size:13px}
h1{font-size:34px;margin:14px 0 8px;letter-spacing:1px}
.sub{color:#687277;margin:0;line-height:1.6}
.card{background:#fff;border:1px solid #e8e4dd;border-radius:24px;padding:22px;box-shadow:0 10px 30px #0000000c;margin-top:14px}
.step{font-size:12px;font-weight:800;letter-spacing:1.5px;color:#8b7d6b;margin-bottom:8px}
h2{font-size:21px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit}
.choice{min-height:78px;border:1px solid #e5dfd5;background:#fffaf5;border-radius:18px;padding:12px;font-weight:800;color:#344047;cursor:pointer}
.choice:active{transform:scale(.98)}
.choice span{font-size:26px;display:block;margin-bottom:4px}
.result{text-align:center;padding:24px 10px 8px}
.place{font-size:14px;color:#8b7d6b}
.food{font-size:30px;font-weight:900;margin-top:10px;line-height:1.3}
.message{font-size:15px;color:#687277;margin-top:10px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.primary,.secondary{border-radius:999px;padding:13px 22px;border:1px solid;cursor:pointer;font-weight:800}
.primary{background:#405d5b;color:white;border-color:#405d5b}
.secondary{background:white;color:#405d5b;border-color:#b9c8c6}
.hidden{display:none}
.footer{text-align:center;color:#92999b;font-size:12px;margin-top:20px}
@media(max-width:360px){h1{font-size:29px}.food{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="badge">🍽️ DINNER DECIDER</div>
<h1>今晚吃什麼？</h1>
<p class="sub">不要再說「都可以」了，交給命運決定！😂</p>
</header>

<section class="card" id="step1">
<div class="step">ROUND 1</div>
<h2>📍 第一關：今天去哪裡？</h2>
<div class="grid" id="locations"></div>
</section>

<section class="card hidden" id="step2">
<div class="step">ROUND 2</div>
<h2>🎰 第二關：抽今晚的店家</h2>
<p class="sub" id="hint"></p>
<div class="result">
<div class="place" id="place"></div>
<div class="food" id="food">準備好了嗎？</div>
<div class="message" id="message">按下按鈕，讓命運替你決定。</div>
</div>
<div class="actions">
<button class="primary" id="draw">🎰 抽一家！</button>
<button class="secondary" id="back">← 換個地方</button>
</div>
</section>
<div class="footer">今晚吃什麼，不再糾結。</div>
</div>

<script>
const places={
"廣東路":["來一碗","粥先生","霖德烤鴨","周記廣東腸粉"],
"勝利路":["渡時機","津大鮮魚湯"],
"林森路":["林森麵店","舊庄-人文懷舊食堂","小財飽の馬鈴薯煎餅&鳥蛋","愛這煎-蚵仔煎","天津蔥抓餅","北方園牛肉拉麵","愛佳鍋燒麵","午後の可麗餅","黃家純手工鮮肉包饅頭","無名煎餃","林森雞排","老家餡餅","楊記便當","日船章魚燒"],
"夜市":["上讚肉圓","王朝"],
"大埔":["雞肉飯","大腸包小腸","鴨肉飯","羊肉炒飯","酵素臭豆腐"],
"其他":["碗李麵","小二春鍋燒","愛家臭豆腐","西安褲袋麵","文成麵店","八八面館","小胖水餃","一級棒牛肉麵","石鍋河粉","食米屋炒飯"]
};
const icons={"廣東路":"🍜","勝利路":"🍲","林森路":"🥟","夜市":"🏮","大埔":"🍚","其他":"🎲"};
let current="",last="";
const $=id=>document.getElementById(id);
Object.keys(places).forEach(p=>{
 const b=document.createElement("button");
 b.className="choice";
 b.innerHTML=`<span>${icons[p]}</span>${p}`;
 b.onclick=()=>selectPlace(p);
 $("locations").appendChild(b);
});
function selectPlace(p){
 current=p; last="";
 $("step1").classList.add("hidden");
 $("step2").classList.remove("hidden");
 $("place").textContent=icons[p]+" "+p;
 $("hint").textContent=`從 ${places[p].length} 個選項中，抽出今晚的命運。`;
 $("food").textContent="準備好了嗎？";
 $("message").textContent="按下按鈕，讓命運替你決定。";
 $("draw").textContent="🎰 抽一家！";
 window.scrollTo({top:0,behavior:"smooth"});
}
$("draw").onclick=()=>{
 const list=places[current];
 const pool=list.length>1?list.filter(x=>x!==last):list;
 const pick=pool[Math.floor(Math.random()*pool.length)];
 last=pick;
 $("food").textContent=pick;
 const lines=["今晚就它了！不要再猶豫 😂","命運已經決定，不能反悔！","這家被命運選中了 🍽️","今天的晚餐，就是它！","好了，大家出發！🚗💨"];
 $("message").textContent=lines[Math.floor(Math.random()*lines.length)];
 $("draw").textContent="🔄 再抽一次";
};
$("back").onclick=()=>{
 $("step2").classList.add("hidden");
 $("step1").classList.remove("hidden");
 window.scrollTo({top:0,behavior:"smooth"});
};
</script>
</body>
</html>
